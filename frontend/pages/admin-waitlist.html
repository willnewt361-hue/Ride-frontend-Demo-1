      <nav class="sidebar-nav">
        <a href="admin-dashboard.html" class="nav-item">
          <span class="nav-icon">🛡️</span>

        <a href="admin-safety.html" class="nav-item">

      <section class="content-card">

          <div class="waitlist-row header">

            <span>Role</span>
            <span>Position</span>
            <span>Status</span>
            <span>Actions</span>
          </div>
          <div class="waitlist-row">
            <span>Sarah Nakato</span>
            <span>Rider</span>
            <span>#347</span>
            <span class="status-badge pending">Pending</span>
            <span class="actions">
              <button class="btn-green">Approve</button>
              <button class="btn-red">Reject</button>
            </span>
          </div>
          <div class="waitlist-row">
            <span>James Okello</span>
            <span>Driver</span>
            <span>#89</span>
            <span class="status-badge pending">Pending</span>
            <span class="actions">
              <button class="btn-green">Approve</button>
              <button class="btn-red">Reject</button>
            </span>
          </div>
        </div>
      </section>
